[project]
name = "traffic-anomaly-detector"
version = "1.0.0"
description = "Lightweight network traffic anomaly detection tool based on Isolation Forest"
authors = [{ name = "Wenduo Wang", email = "wenduowang22@163.com" }]
requires-python = ">=3.10"
dependencies = [
    "scapy==2.5.0",
    "scikit-learn==1.4.2",
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "python-multipart==0.0.9",
    "pydantic==2.7.1",
]

[project.scripts]
tad = "src.cli:main"

[tool.ruff]
line-length = 120
target-version = "py310"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

